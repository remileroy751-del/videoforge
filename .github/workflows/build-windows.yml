name: Build Windows

on:
  # Compilation automatique à chaque modification sur main
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  # Permet aussi de lancer la compilation manuellement
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install imageio-ffmpeg
          pip install pyinstaller

      - name: Vérifier les fichiers Python
        run: |
          python -m py_compile app.py engine.py winfix.py
          python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Construire l'application
        run: |
          pyinstaller --noconfirm --clean --windowed --name Ty-Videos-Studio --icon assets/app.ico --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all moviepy `
            --collect-all imageio `
            --collect-all imageio_ffmpeg `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all huggingface_hub `
            --collect-all onnxruntime `
            --collect-all av `
            --collect-all certifi `
            --copy-metadata imageio `
            --copy-metadata imageio-ffmpeg `
            --copy-metadata moviepy `
            --copy-metadata faster-whisper `
            --copy-metadata ctranslate2 `
            --copy-metadata tokenizers `
            --copy-metadata huggingface-hub `
            --copy-metadata tqdm `
            --copy-metadata requests `
            --copy-metadata packaging `
            --copy-metadata filelock `
            --copy-metadata pyyaml `
            --copy-metadata regex `
            --copy-metadata numpy `
            app.py

      - name: Construire l'installateur Windows
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Vérifier l'installateur
        shell: pwsh
        run: |
          if (!(Test-Path "installer_output\Ty-Videos-Studio-Setup.exe")) { throw "Installateur non généré." }
          Get-Item "installer_output\Ty-Videos-Studio-Setup.exe" | Format-List Name,Length,FullName

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: Ty-Videos-Studio-Windows
          path: installer_output/Ty-Videos-Studio-Setup.exe
          if-no-files-found: error
